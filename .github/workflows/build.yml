name: Build (Windows)

on:
  push:
    branches: [originium]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows MSVC x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      - name: Fetch prebuilt dependencies
        shell: pwsh
        run: ./setup-deps.ps1

      - name: Build
        shell: pwsh
        run: |
          qmake moonlight-qt.pro CONFIG+=release
          nmake

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse app/release/* dist/
          Set-Content dist/portable.dat ''
          Compress-Archive -Path dist/* -DestinationPath Moonlight-Originium-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-windows-msvc
          path: Moonlight-Originium-x64.zip
          if-no-files-found: warn
