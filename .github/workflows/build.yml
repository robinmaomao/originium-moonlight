name: Build (Windows)

on:
  push:
    branches: [originium]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows MSVC x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      - name: Fetch prebuilt dependencies
        shell: pwsh
        run: ./setup-deps.ps1

      - name: Build and deploy x64
        shell: cmd
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\6.8.3\msvc2022_64\bin
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-windows-msvc
          path: build/installer-x64-release/MoonlightPortable-x64-*.zip
          if-no-files-found: error
